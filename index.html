<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Settings for iOS / iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نظام العمادة">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/College_Board_logo.svg/1024px-College_Board_logo.svg.png">
    
    <title>نظام إدارة اجتماعات العمادة - الكلية التقنية الهندسية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#0f172a', 
                            secondary: '#1e293b',
                            accent: '#fbbf24', 
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK (Compat version for simplicity) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- ========== شاشة تسجيل الدخول ========== -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-4 bg-slate-100 absolute inset-0 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border-t-4 border-brand-accent">
            <div class="bg-brand-primary p-6 text-center">
                <i class="fa-solid fa-building-columns text-4xl text-brand-accent mb-3"></i>
                <h2 class="text-2xl font-black text-white">الكلية التقنية الهندسية</h2>
                <p class="text-slate-300 text-sm mt-1">نظام إدارة اجتماعات العمادة</p>
            </div>
            <div class="p-6 sm:p-8 space-y-6">
                <div class="text-center">
                    <h3 class="text-lg font-bold text-slate-700">تسجيل الدخول</h3>
                    <p class="text-sm text-slate-500">الرجاء تحديد صلاحية الدخول الخاصة بك</p>
                </div>
                <div class="space-y-3">
                    <button onclick="login('manager')" class="w-full flex items-center justify-between p-4 border-2 border-slate-200 rounded-xl hover:border-brand-primary hover:bg-slate-50 transition group">
                        <div class="flex items-center gap-3">
                            <div class="bg-brand-primary/10 text-brand-primary p-2 rounded-lg group-hover:bg-brand-primary group-hover:text-white transition">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-slate-800">مدير المكتب</span>
                                <span class="block text-xs text-slate-500">إدارة وجدولة الاجتماعات</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-left text-slate-300"></i>
                    </button>
                    <button onclick="login('dean')" class="w-full flex items-center justify-between p-4 border-2 border-slate-200 rounded-xl hover:border-brand-accent hover:bg-amber-50 transition group">
                        <div class="flex items-center gap-3">
                            <div class="bg-amber-100 text-amber-600 p-2 rounded-lg group-hover:bg-brand-accent group-hover:text-white transition">
                                <i class="fa-solid fa-star"></i>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-slate-800">السيد العميد</span>
                                <span class="block text-xs text-slate-500">متابعة وعرض الجدول</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-left text-slate-300"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== واجهة التطبيق الرئيسية ========== -->
    <div id="mainAppView" class="hidden flex-col min-h-screen">
        
        <!-- الشريط العلوي -->
        <header class="bg-brand-primary text-white shadow-md sticky top-0 z-40 border-b-4 border-brand-accent">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-building-columns text-2xl text-brand-accent"></i>
                        <div>
                            <h1 class="font-black text-lg sm:text-xl leading-tight">الكلية التقنية الهندسية</h1>
                            <span id="roleBadge" class="text-brand-accent font-bold text-xs bg-black/30 px-2 py-0.5 rounded"></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="hidden sm:flex items-center gap-2 bg-green-500/20 text-green-300 px-3 py-1 rounded-full text-xs font-bold">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> متصل
                        </div>
                        <button onclick="logout()" class="bg-red-500/20 text-red-100 hover:bg-red-500 p-2 rounded-lg text-sm font-bold transition">
                            <i class="fa-solid fa-power-off"></i> <span class="hidden sm:inline">خروج</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- المحتوى (Dashboard) -->
        <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            <!-- 1. السجل الرسمي للاجتماعات -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex flex-wrap justify-between items-center gap-3">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-brand-primary"></i> السجل الرسمي للاجتماعات
                    </h3>
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="searchInput" placeholder="بحث باسم الجهة..." class="w-full pl-3 pr-9 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none">
                        <i class="fa-solid fa-search absolute right-3.5 top-3 text-slate-400 text-xs"></i>
                    </div>
                </div>
                <div class="overflow-x-auto relative">
                    <table class="w-full text-right border-collapse min-w-[600px]">
                        <thead class="bg-brand-primary text-white text-sm">
                            <tr>
                                <th class="py-3 px-4 w-12 text-center">#</th>
                                <th class="py-3 px-4">الجهة المعنية</th>
                                <th class="py-3 px-4">التاريخ والوقت</th>
                                <th class="py-3 px-4">الحالة</th>
                                <th id="actionsHeader" class="py-3 px-4 text-center hidden">إدارة</th>
                            </tr>
                        </thead>
                        <tbody id="meetingsTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr><td colspan="5" class="text-center py-6 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري تحميل البيانات...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 2. الإحصائيات والتوجيهات -->
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- المخرجات (التوجيهات) -->
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[300px]">
                    <div class="bg-slate-50 border-b border-slate-100 px-4 py-3">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-green-600"></i> التوجيهات ومخرجات الاجتماعات
                        </h3>
                    </div>
                    <div class="p-4 flex-grow overflow-y-auto space-y-3" id="directivesList">
                        <!-- Directives -->
                    </div>
                </div>
                
                <!-- الرسم البياني -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 h-[300px] flex flex-col">
                    <h3 class="font-bold text-slate-800 text-sm text-center mb-2">إحصائية الحالات</h3>
                    <div class="relative flex-grow flex items-center justify-center">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- 3. نموذج الإضافة -->
            <section id="managerPanel" class="hidden max-w-2xl mx-auto w-full pb-10">
                <div class="bg-white rounded-2xl shadow-md border-t-4 border-brand-primary overflow-hidden">
                    <div class="bg-slate-50 border-b border-slate-100 px-5 py-4">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-plus-circle text-brand-primary"></i> إضافة / تعديل اجتماع
                        </h3>
                    </div>
                    <form id="meetingForm" class="p-5 flex flex-col gap-4">
                        <input type="hidden" id="meetingId">
                        
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">الجهة المعنية <span class="text-red-500">*</span></label>
                            <input type="text" id="entityInput" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm bg-slate-50">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">التاريخ <span class="text-red-500">*</span></label>
                                <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">الوقت <span class="text-red-500">*</span></label>
                                <input type="time" id="timeInput" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm bg-slate-50">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">الحالة <span class="text-red-500">*</span></label>
                            <select id="statusInput" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-primary outline-none text-sm bg-slate-50 font-bold" onchange="toggleOutcomes()">
                                <option value="upcoming">مجدول (قادم)</option>
                                <option value="completed">مكتمل</option>
                                <option value="postponed">مؤجل</option>
                            </select>
                        </div>

                        <div id="outcomesContainer" class="hidden">
                            <label class="block text-sm font-bold text-green-700 mb-1">مخرجات الاجتماع والتوجيهات</label>
                            <textarea id="outcomesInput" rows="2" class="w-full p-3 border border-green-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none text-sm bg-green-50"></textarea>
                        </div>
                        
                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="submitBtn" class="flex-grow bg-brand-primary text-white font-bold py-2.5 rounded-xl hover:bg-brand-secondary transition">حفظ في السحابة</button>
                            <button type="button" onclick="resetForm()" class="bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl hover:bg-slate-300 transition">إلغاء</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- السكربت والمنطق -->
    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyC3jZ0Ee30JNoKd6Swt3Pve0mnY3SxyLqQ",
            authDomain: "deanerysystem.firebaseapp.com",
            projectId: "deanerysystem",
            storageBucket: "deanerysystem.firebasestorage.app",
            messagingSenderId: "881015172460",
            appId: "1:881015172460:web:9d70ae18a7c8a3a82f1749"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentRole = null;
        let meetings = [];
        let chartInstance = null;

        // Login Logic
        window.login = (role) => {
            currentRole = role;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainAppView').classList.remove('hidden');
            document.getElementById('mainAppView').classList.add('flex');
            
            const roleBadge = document.getElementById('roleBadge');
            const managerPanel = document.getElementById('managerPanel');
            const actionsHeader = document.getElementById('actionsHeader');

            if (role === 'manager') {
                roleBadge.textContent = 'مدير المكتب (صلاحية الإدارة)';
                managerPanel.classList.remove('hidden');
                actionsHeader.classList.remove('hidden');
            } else {
                roleBadge.textContent = 'السيد العميد (صلاحية المتابعة)';
                managerPanel.classList.add('hidden');
                actionsHeader.classList.add('hidden');
            }
            renderDashboard();
        };

        window.logout = () => {
            currentRole = null;
            document.getElementById('mainAppView').classList.add('hidden');
            document.getElementById('mainAppView').classList.remove('flex');
            document.getElementById('loginView').classList.remove('hidden');
        };

        // الاستماع للتحديثات اللحظية من قاعدة البيانات
        db.collection("meetings").onSnapshot((querySnapshot) => {
            meetings = [];
            querySnapshot.forEach((doc) => {
                meetings.push({ id: doc.id, ...doc.data() });
            });
            renderDashboard(document.getElementById('searchInput').value.toLowerCase());
        }, (error) => {
            console.error("خطأ في جلب البيانات: ", error);
            alert("حدث خطأ في الاتصال بقاعدة البيانات. يرجى التأكد من تفعيل وضع الاختبار (Test Mode) في Firestore.");
        });

        // Form Logic
        window.toggleOutcomes = () => {
            const status = document.getElementById('statusInput').value;
            const container = document.getElementById('outcomesContainer');
            container.classList.toggle('hidden', status !== 'completed');
        };

        window.resetForm = () => {
            document.getElementById('meetingForm').reset();
            document.getElementById('meetingId').value = '';
            document.getElementById('submitBtn').innerHTML = 'حفظ في السحابة';
            toggleOutcomes();
        };

        document.getElementById('meetingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';
            btn.disabled = true;

            const id = document.getElementById('meetingId').value;
            const meetingData = {
                entity: document.getElementById('entityInput').value,
                date: document.getElementById('dateInput').value,
                time: document.getElementById('timeInput').value,
                status: document.getElementById('statusInput').value,
                outcomes: document.getElementById('statusInput').value === 'completed' ? document.getElementById('outcomesInput').value : ''
            };

            try {
                if (id) {
                    await db.collection("meetings").doc(id).update(meetingData);
                } else {
                    await db.collection("meetings").add(meetingData);
                }
                resetForm();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("حدث خطأ أثناء حفظ الاجتماع.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'حفظ في السحابة';
            }
        });

        window.editMeeting = (id) => {
            const meeting = meetings.find(m => m.id === id);
            if(meeting) {
                document.getElementById('meetingId').value = meeting.id;
                document.getElementById('entityInput').value = meeting.entity;
                document.getElementById('dateInput').value = meeting.date;
                document.getElementById('timeInput').value = meeting.time;
                document.getElementById('statusInput').value = meeting.status;
                document.getElementById('outcomesInput').value = meeting.outcomes || '';
                document.getElementById('submitBtn').innerHTML = 'تحديث البيانات';
                toggleOutcomes();
                document.getElementById('entityInput').focus();
            }
        };

        window.deleteMeeting = async (id) => {
            if(confirm('هل أنت متأكد من حذف هذا الاجتماع؟')) {
                try {
                    await db.collection("meetings").doc(id).delete();
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    alert("حدث خطأ أثناء الحذف.");
                }
